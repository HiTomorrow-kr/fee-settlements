[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintenance-bills"
version = "0.1.0"
description = "Generates maintenance fee bills (calculation, image rendering, history) as an independent program."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "selenium>=4.18.1",
]

[project.scripts]
maintenance-bills = "maintenance_bills.cli:main"

[tool.setuptools.packages.find]
include = ["maintenance_bills*"]
