[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fee-settlements"
version = "0.1.0"
description = "Fills in maintenance fee settlement sheets and saves them as images."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "selenium>=4.18.1",
]

[project.scripts]
fee-settlements = "fee_settlements.cli:main"

[tool.setuptools.packages.find]
include = ["fee_settlements*"]

[tool.pytest.ini_options]
pythonpath = ["."]
