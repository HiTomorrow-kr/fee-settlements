<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>중간관리비 정산서</title>
<style>
  @page { size: A4 landscape; margin: 0; }
  @media print { #controls { display: none; } [contenteditable]:focus { outline: none; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #000; font-family: "Noto Sans CJK KR", "Malgun Gothic", sans-serif; font-size: 11px; }
  #controls { padding: 3mm 8mm; }
  #controls button { padding: 4px 12px; font: inherit; cursor: pointer; }
  #controls button.active { background: #1f2937; color: #fff; }
  .sheet { display: flex; width: 297mm; height: 210mm; }
  .half { flex: 1; padding: 3mm 8mm 5mm; display: flex; flex-direction: column; gap: 1.5mm; }
  .half + .half { border-left: 1px dashed #000; }
  h1 { margin: 0; text-align: center; font-size: 18px; }
  p { margin: 0; }
  .notice { font-size: 10px; }
  .notice:empty { display: none; }
  .row { display: flex; justify-content: space-between; min-height: 1.4em; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #000; padding: 2px 4px; height: 5.6mm; text-align: center; }
  td.num { text-align: right; }
  .items, .meters { table-layout: fixed; }
  tr.spacer td { height: 1.5mm; padding: 0; border: none; }
  th.gap, td.gap { width: 1.5mm; border: none; padding: 0; }
  .row .write { display: inline-block; min-width: 30mm; text-align: right; }
  span[data-field] { display: inline-block; vertical-align: top; min-width: 25mm; min-height: 1.4em; }
  span[data-field="bank"] { min-width: 1em; }
  p[data-field] { min-height: 1.4em; }
  [data-field="address"] { min-width: 50mm; }
  [contenteditable]:focus { outline: 2px solid #3b82f6; outline-offset: -2px; }
  .sign { display: flex; flex-direction: column; gap: 1.5mm; }
  .sign .row { gap: 6mm; justify-content: flex-start; }
  .sign .field { flex: 1; display: flex; align-items: flex-start; gap: 2mm; white-space: nowrap; }
  .sign .seal { margin-right: 13mm; }
  .sign .line { flex: 1; height: 5mm; }
  .pay { display: flex; flex-direction: column; gap: 1mm; }
  .pay p { min-height: 1.4em; }
  body.lang-en h1 { font-size: 15px; }
  body.lang-en .items thead th, body.lang-en .items tbody td:not(.num):not(.gap) { font-size: 8px; line-height: 1.05; padding: 1px 2px; }
  body.lang-en .meters thead th { font-size: 8.5px; padding: 1px 2px; }
  body.lang-en .meters td.cat { font-size: 7.5px; padding: 1px 2px; }
  body.lang-en .meters tbody td:not(.num):not(.gap):not(.cat) { font-size: 9px; padding: 1px 2px; }
  body.lang-en col.cat { width: 13mm; }
</style>
<script src="assets/html2canvas.min.js"></script>
</head>
<body>
<div id="controls">
  <button type="button" data-lang="ko">한국어</button>
  <button type="button" data-lang="en">English</button>
  <button id="print-btn" type="button" data-i18n="print">출력</button>
  <button id="save-image-btn" type="button" data-i18n="saveImage">이미지로 저장</button>
</div>
<div class="sheet">
  <!-- Two identical halves: one kept by the office, one handed to the resident. -->
  <section class="half" data-copy="office">
    <h1><span data-i18n="title">중간관리비</span> <span data-i18n="copyOffice">(관리소용)</span></h1>
    <p class="notice" data-field="notice"></p>
    <div class="row"><span data-field="address"></span><span><span data-i18n="area">면적 :</span> <span class="write" data-field="area"></span></span></div>
    <table class="items">
      <thead><tr><th data-i18n="itemName">항 목 명</th><th data-i18n="amount">정산금액</th><th class="gap"></th><th data-i18n="itemName">항 목 명</th><th data-i18n="amount">정산금액</th><th class="gap"></th><th data-i18n="itemName">항 목 명</th><th data-i18n="amount">정산금액</th></tr></thead>
      <tbody data-field="fees"></tbody>
      <tfoot>
        <tr><td colspan="4" data-i18n="monthTotal">당월합계</td><td colspan="4" class="num" data-field="month-total"></td></tr>
        <tr class="spacer"><td colspan="8"></td></tr>
        <tr><td colspan="4" data-i18n="unpaid">미납금</td><td colspan="4" class="num" data-field="unpaid"></td></tr>
        <tr><td colspan="4" data-i18n="lateFee">연체료</td><td colspan="4" class="num" data-field="late-fee"></td></tr>
        <tr><td colspan="4" data-i18n="settleTotal">정산합계</td><td colspan="4" class="num" data-field="settle-total"></td></tr>
      </tfoot>
    </table>
    <table class="meters">
      <thead><tr><th data-i18n="type">구분</th><th data-i18n="meteringMonth">검침월</th><th data-i18n="previous">전월</th><th data-i18n="current">당월</th><th data-i18n="usage">사용량</th><th class="gap"></th><th data-i18n="type">구분</th><th data-i18n="meteringMonth">검침월</th><th data-i18n="previous">전월</th><th data-i18n="current">당월</th><th data-i18n="usage">사용량</th></tr></thead>
      <tbody data-field="meters"></tbody>
    </table>
    <p><span data-i18n="period">- 중간관리비 정산기간 :</span> <span data-field="period"></span></p>
    <div class="sign">
      <div class="row"><span class="field"><span data-i18n="outName">전출자 성명</span> <span class="line" data-field="out-name"></span> <span class="seal" data-i18n="seal">(인)</span></span><span class="field"><span data-i18n="contact">연락처 :</span> <span class="line" data-field="out-contact"></span></span></div>
      <div class="row"><span class="field"><span data-i18n="inName">전입자 성명</span> <span class="line" data-field="in-name"></span> <span class="seal" data-i18n="seal">(인)</span></span><span class="field"><span data-i18n="contact">연락처 :</span> <span class="line" data-field="in-contact"></span></span></div>
    </div>
    <div class="pay">
      <p><span data-field="bank" data-i18n="bank">계좌</span> : <span data-field="account"></span></p>
      <p class="sum"><span data-i18n="settlement">정산금 :</span> <span data-field="settlement"></span></p>
    </div>
  </section>
</div>
<script src="assets/bill.js"></script>
</body>
</html>
