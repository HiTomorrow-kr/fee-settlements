<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>중간관리비 정산서</title>
<style>
  @page { size: A4 landscape; margin: 0; }
  @media print { #controls { display: none; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #000; font-family: "Noto Sans CJK KR", "Malgun Gothic", sans-serif; font-size: 11px; }
  #controls { padding: 3mm 8mm; }
  #controls button { padding: 4px 12px; font: inherit; cursor: pointer; }
  .sheet { display: flex; width: 297mm; height: 210mm; }
  .half { flex: 1; padding: 3mm 8mm 5mm; display: flex; flex-direction: column; gap: 1.5mm; }
  .half + .half { border-left: 1px dashed #000; }
  h1 { margin: 0; text-align: center; font-size: 18px; }
  p { margin: 0; }
  .notice { font-size: 10px; }
  .notice:empty { display: none; }
  .row { display: flex; justify-content: space-between; min-height: 1.4em; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #000; padding: 2px 4px; height: 5.8mm; text-align: center; }
  td.num { text-align: right; }
  .items, .meters { table-layout: fixed; }
  tr.spacer td { height: 1.5mm; padding: 0; border: none; }
  th.gap, td.gap { width: 1.5mm; border: none; padding: 0; }
  .row .write { display: inline-block; min-width: 30mm; text-align: right; }
  span[data-field] { display: inline-block; vertical-align: top; min-width: 25mm; min-height: 1.4em; }
  p[data-field] { min-height: 1.4em; }
  [data-field="address"] { min-width: 50mm; }
  [contenteditable]:focus { outline: 2px solid #3b82f6; outline-offset: -2px; }
  .sign { display: flex; flex-direction: column; gap: 1.5mm; }
  .sign .row { gap: 6mm; justify-content: flex-start; }
  .sign .field { flex: 1; display: flex; align-items: flex-start; gap: 2mm; white-space: nowrap; }
  .sign .line { flex: 1; height: 5mm; }
  .pay { display: flex; flex-direction: column; gap: 1mm; }
  .pay p { min-height: 1.4em; }
</style>
<script src="assets/html2canvas.min.js"></script>
</head>
<body>
<div id="controls"><button id="save-image-btn" type="button">이미지로 저장</button></div>
<div class="sheet">
  <!-- Two identical halves: one kept by the office, one handed to the resident. -->
  <section class="half" data-copy="office">
    <h1><span data-field="title">중간관리비</span> (관리소용)</h1>
    <p class="notice" data-field="notice"></p>
    <div class="row"><span data-field="address"></span><span>면적 : <span class="write" data-field="area"></span></span></div>
    <table class="items">
      <thead><tr><th>항 목 명</th><th>정산금액</th><th class="gap"></th><th>항 목 명</th><th>정산금액</th><th class="gap"></th><th>항 목 명</th><th>정산금액</th></tr></thead>
      <tbody data-field="fees"></tbody>
      <tfoot>
        <tr><td colspan="4">당월합계</td><td colspan="4" class="num" data-field="month-total"></td></tr>
        <tr class="spacer"><td colspan="8"></td></tr>
        <tr><td colspan="4">미납금</td><td colspan="4" class="num" data-field="unpaid"></td></tr>
        <tr><td colspan="4">연체료</td><td colspan="4" class="num" data-field="late-fee"></td></tr>
        <tr><td colspan="4">정산합계</td><td colspan="4" class="num" data-field="settle-total"></td></tr>
      </tfoot>
    </table>
    <table class="meters">
      <thead><tr><th>구분</th><th>검침월</th><th>전월</th><th>당월</th><th>사용량</th><th class="gap"></th><th>구분</th><th>검침월</th><th>전월</th><th>당월</th><th>사용량</th></tr></thead>
      <tbody data-field="meters"></tbody>
    </table>
    <div class="sign">
      <div class="row"><span class="field">전출자 성명 <span class="line" data-field="out-name"></span> (인)</span><span class="field">연락처 : <span class="line" data-field="out-contact"></span></span></div>
      <div class="row"><span class="field">전입자 성명 <span class="line" data-field="in-name"></span> (인)</span><span class="field">연락처 : <span class="line" data-field="in-contact"></span></span></div>
    </div>
    <div class="pay">
      <p>계좌 : <span data-field="account"></span></p>
      <p class="sum">정산금 : <span data-field="settlement"></span></p>
    </div>
  </section>
</div>
<script>
  // The right half is a copy of the left one with only the recipient changed.
  const sheet = document.querySelector(".sheet");
  const office = sheet.querySelector('[data-copy="office"]');

  const feeBody = office.querySelector('[data-field="fees"]');
  for (let i = 0; i < 13; i++) {
    feeBody.insertAdjacentHTML("beforeend", "<tr><td></td><td class='num'></td><td class='gap'></td><td></td><td class='num'></td><td class='gap'></td><td></td><td class='num'></td></tr>");
  }

  // Fixed item names, one list per column group. An empty string is a blank row.
  const FEE_NAMES = [
    [
      "일반관리비(과)", "경비비", "청소비(과)", "",
      "소독비", "승강기유지비", "",
      "수선유지비", "건물보험료", "TV인터넷사용", "일반관리비(비)", "수선유지비(과)", "",
    ],
    [
      "세대전기료", "공동전기료", "승강기전기", "TV수신료", "전력기금", "세대수도료", "공동수도료", "",
      "세대난방비", "기본난방비", "",
      "세대급탕비", "세대가스료",
    ],
    [
      "가수금", "주차비", "관리비보조금", "장기수선충당금", "관리단운영위원", "난방바우처", "", "", "", "",
      "과세합계", "부가세", "비과세합계",
    ],
  ];
  FEE_NAMES.forEach((names, group) => {
    names.forEach((name, row) => { feeBody.rows[row].cells[group * 3].textContent = name; });
  });

  const meterBody = office.querySelector('[data-field="meters"]');
  // Two meters per row: 전기/수도/가스 on the left, 온수/난방/정수 on the right.
  const pairs = [["전기", "온수"], ["수도", "난방"], ["가스", "정수"]];
  const meterCells = (name, m) => (m === 1 ? `<td rowspan="3">${name}</td>` : "") + `<td>${m}개월</td>` + ["prev", "curr", "usage"].map((col) => `<td class="num" data-meter="${name}" data-m="${m}" data-col="${col}"></td>`).join("");
  for (const [left, right] of pairs) {
    for (let m = 1; m <= 3; m++) {
      meterBody.insertAdjacentHTML("beforeend", `<tr>${meterCells(left, m)}<td class="gap"></td>${meterCells(right, m)}</tr>`);
    }
  }

  // Every fillable cell is editable on the left half only; the right half mirrors it.
  const EDITABLE = [
    '[data-field="address"]', '[data-field="area"]',
    '[data-field="month-total"]', '[data-field="unpaid"]', '[data-field="late-fee"]', '[data-field="settle-total"]', '[data-field="out-name"]', '[data-field="out-contact"]',
    '[data-field="in-name"]', '[data-field="in-contact"]', '[data-field="account"]', '[data-field="settlement"]',
    '[data-field="fees"] td:not(.gap)', '[data-field="meters"] td.num',
  ].join(",");
  office.querySelectorAll(EDITABLE).forEach((el) => {
    el.setAttribute("contenteditable", "plaintext-only");
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") e.preventDefault(); });
  });

  // Meter readings take digits and one decimal point, and group the integer part with commas.
  const formatReading = (text) => {
    const [int, ...rest] = text.replace(/[^0-9.]/g, "").split(".");
    const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return rest.length ? `${grouped}.${rest.join("")}` : grouped;
  };
  office.querySelectorAll('[data-field="meters"] td.num').forEach((el) => {
    el.addEventListener("beforeinput", (e) => {
      if (e.data && /[^0-9.]/.test(e.data)) e.preventDefault();
    });
    el.addEventListener("input", () => {
      const formatted = formatReading(el.textContent);
      if (formatted === el.textContent) return;
      el.textContent = formatted;
      const sel = getSelection();
      sel.selectAllChildren(el);
      sel.collapseToEnd();
    });
  });

  // A month's current reading carries into the next month's previous reading, which stays editable.
  office.querySelectorAll('[data-col="curr"]').forEach((el) => {
    el.addEventListener("input", () => {
      const next = office.querySelector(`[data-meter="${el.dataset.meter}"][data-m="${+el.dataset.m + 1}"][data-col="prev"]`);
      if (!next) return;
      next.textContent = el.textContent;
      next.dispatchEvent(new Event("input"));
    });
  });

  const resident = office.cloneNode(true);
  resident.dataset.copy = "resident";
  resident.querySelector("h1").lastChild.textContent = " (전출자용)";
  sheet.appendChild(resident);

  const source = office.querySelectorAll(EDITABLE);
  const mirror = resident.querySelectorAll(EDITABLE);
  mirror.forEach((el) => el.removeAttribute("contenteditable"));
  source.forEach((el, i) => el.addEventListener("input", () => { mirror[i].textContent = el.textContent; }));

  // Saves the two halves as one PNG; the focus outline is dropped so it doesn't end up in the image.
  const renderSheet = () => {
    if (document.activeElement) document.activeElement.blur();
    return html2canvas(sheet, { scale: 2 });
  };
  document.getElementById("save-image-btn").addEventListener("click", async () => {
    const canvas = await renderSheet();
    const name = office.querySelector('[data-field="address"]').textContent.trim() || "bill";
    const link = document.createElement("a");
    link.download = `maintenance_bill_${name}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
</script>
</body>
</html>
