<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>중간관리비 정산서</title>
<style>
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #000; font-family: "Noto Sans CJK KR", "Malgun Gothic", sans-serif; font-size: 11px; }
  .sheet { display: flex; width: 297mm; height: 210mm; }
  .half { flex: 1; padding: 8mm; display: flex; flex-direction: column; gap: 3mm; }
  .half + .half { border-left: 1px dashed #000; }
  h1 { margin: 0; text-align: center; font-size: 18px; }
  p { margin: 0; }
  .notice { font-size: 10px; min-height: 1.4em; }
  .row { display: flex; justify-content: space-between; min-height: 1.4em; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #000; padding: 2px 4px; height: 6mm; text-align: center; }
  td.num { text-align: right; }
  .items th, .items td { width: 25%; }
  .total { display: flex; justify-content: space-between; border: 1px solid #000; padding: 2px 4px; height: 6mm; align-items: center; }
  .sign { display: flex; flex-direction: column; gap: 2mm; }
  .account { margin-top: auto; min-height: 1.4em; }
  .amount { text-align: right; font-size: 14px; min-height: 1.4em; }
</style>
</head>
<body>
<div class="sheet">
  <!-- Two identical halves: one kept by the office, one handed to the resident. -->
  <section class="half" data-copy="office">
    <h1><span data-field="title">중간관리비</span> (관리소용)</h1>
    <p class="notice" data-field="notice"></p>
    <div class="row"><span data-field="address"></span><span data-field="area"></span></div>
    <table class="items">
      <thead><tr><th>항 목 명</th><th>정산금액</th><th>항 목 명</th><th>정산금액</th></tr></thead>
      <tbody data-field="fees"></tbody>
    </table>
    <div class="total"><span>당월합계</span><span data-field="month-total"></span></div>
    <table class="meters">
      <thead><tr><th>구분</th><th>검침월</th><th>전월</th><th>당월</th><th>사용량</th></tr></thead>
      <tbody data-field="meters"></tbody>
    </table>
    <p data-field="period"></p>
    <div class="sign">
      <div class="row"><span>전출자 성명 (인)</span><span>연락처:</span></div>
      <div class="row"><span>전입자 성명 (인)</span><span>연락처:</span></div>
    </div>
    <p class="account" data-field="account"></p>
    <p class="amount" data-field="settlement"></p>
  </section>
</div>
<script>
  // The right half is a copy of the left one with only the recipient changed.
  const sheet = document.querySelector(".sheet");
  const office = sheet.querySelector('[data-copy="office"]');

  const feeBody = office.querySelector('[data-field="fees"]');
  for (let i = 0; i < 10; i++) {
    feeBody.insertAdjacentHTML("beforeend", "<tr><td></td><td class='num'></td><td></td><td class='num'></td></tr>");
  }

  const meterBody = office.querySelector('[data-field="meters"]');
  for (const name of ["전기", "수도", "가스"]) {
    for (let m = 1; m <= 3; m++) {
      const head = m === 1 ? `<td rowspan="3">${name}</td>` : "";
      meterBody.insertAdjacentHTML("beforeend", `<tr>${head}<td>${m}개월</td><td class="num"></td><td class="num"></td><td class="num"></td></tr>`);
    }
  }

  const resident = office.cloneNode(true);
  resident.dataset.copy = "resident";
  resident.querySelector("h1").lastChild.textContent = " (전출자용)";
  sheet.appendChild(resident);
</script>
</body>
</html>
